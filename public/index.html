<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
<title>玄真大师 · 八字详批</title>
<meta name="theme-color" content="#8b1a1a" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="avatar big">师</div>
    <div class="who"><b>玄真大师</b><span><i class="dot"></i>在线 · 生辰八字详批</span></div>
    <button id="reset" class="reset" type="button">新排盘</button>
  </header>
  <main id="list" class="list">
    <div class="notice">— 内容基于传统命理文化生成，仅供娱乐参考 —</div>
  </main>
  <div id="quick" class="quick"></div>
  <form id="composer" class="composer">
    <textarea id="input" rows="1" maxlength="300" placeholder="发送出生日期、时辰、性别…" enterkeyhint="send"></textarea>
    <button id="send" type="submit" aria-label="发送">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
    </button>
  </form>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
